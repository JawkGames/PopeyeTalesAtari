<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kamera Çöp Adam</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #bilgi {
    position: fixed; left: 0; right: 0; top: 0; padding: 14px;
    color: #fff; font: 16px/1.4 system-ui, sans-serif; text-align: center;
  }
  #basla {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 18px 34px; font: 600 20px system-ui, sans-serif;
    color: #000; background: #fff; border: 0; border-radius: 12px;
  }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="tuval"></canvas>
<div id="bilgi">Telefonu sabitle, 1,5-2 m geri çekil.</div>
<button id="basla">Başla</button>

<script type="module">
import { PoseLandmarker, FilesetResolver } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const tuval = document.getElementById("tuval");
const ctx = tuval.getContext("2d");
const bilgi = document.getElementById("bilgi");
const basla = document.getElementById("basla");

let algilayici = null;
let yumusak = null;        // yumuşatılmış noktalar
let ayaktaOmuzY = null;    // ayakta dururkenki omuz yüksekliği
let kalibreSayac = 0;
let kalibreToplam = 0;

function boyutla() {
  tuval.width = innerWidth * devicePixelRatio;
  tuval.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", boyutla);
boyutla();

// Ekrana dokununca yeniden kalibre et
tuval.addEventListener("pointerdown", () => {
  ayaktaOmuzY = null; kalibreSayac = 0; kalibreToplam = 0;
});

basla.addEventListener("click", async () => {
  basla.remove();
  try {
    bilgi.textContent = "Kamera açılıyor...";
    const akis = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = akis;
    await video.play();

    bilgi.textContent = "Model yükleniyor...";
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    algilayici = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numPoses: 1
    });
    bilgi.textContent = "Dik dur, ölçüyorum...";
    requestAnimationFrame(dongu);
  } catch (hata) {
    bilgi.textContent = "Hata: " + hata.message;
  }
});

let sonZaman = -1;
function dongu() {
  requestAnimationFrame(dongu);
  if (!algilayici || video.readyState < 2) return;
  if (video.currentTime === sonZaman) return;
  sonZaman = video.currentTime;

  const sonuc = algilayici.detectForVideo(video, performance.now());
  const noktalar = sonuc.landmarks && sonuc.landmarks[0];

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, tuval.width, tuval.height);

  if (!noktalar) {
    bilgi.textContent = "Seni göremiyorum, kadraja gir.";
    return;
  }

  // Yumuşatma (titremeyi azaltır)
  if (!yumusak) yumusak = noktalar.map(n => ({ x: n.x, y: n.y }));
  for (let i = 0; i < noktalar.length; i++) {
    yumusak[i].x += (noktalar[i].x - yumusak[i].x) * 0.5;
    yumusak[i].y += (noktalar[i].y - yumusak[i].y) * 0.5;
  }

  // Video oranını koruyarak ekrana sığdır, aynala
  const vw = video.videoWidth, vh = video.videoHeight;
  const olcek = Math.min(tuval.width / vw, tuval.height / vh);
  const ox = (tuval.width - vw * olcek) / 2;
  const oy = (tuval.height - vh * olcek) / 2;
  const P = i => ({
    x: ox + (1 - yumusak[i].x) * vw * olcek,
    y: oy + yumusak[i].y * vh * olcek
  });
  const orta = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

  const solOmuz = P(11), sagOmuz = P(12), solDirsek = P(13), sagDirsek = P(14);
  const solBilek = P(15), sagBilek = P(16), solKalca = P(23), sagKalca = P(24);
  const solDiz = P(25), sagDiz = P(26), solAyak = P(27), sagAyak = P(28);
  const boyun = orta(solOmuz, sagOmuz);
  const kalca = orta(solKalca, sagKalca);
  const burun = P(0);

  const omuzGenislik = Math.hypot(solOmuz.x - sagOmuz.x, solOmuz.y - sagOmuz.y);
  const kafaYaricap = Math.max(omuzGenislik * 0.38, 8);

  // Eğilme algılama: omuz yüksekliği ayaktaki hâle göre düştü mü?
  const omuzY = (yumusak[11].y + yumusak[12].y) / 2;
  const govde = Math.abs((yumusak[23].y + yumusak[24].y) / 2 - omuzY) || 0.2;
  let egildi = false;
  if (ayaktaOmuzY === null) {
    kalibreToplam += omuzY; kalibreSayac++;
    if (kalibreSayac >= 30) ayaktaOmuzY = kalibreToplam / kalibreSayac;
  } else {
    egildi = (omuzY - ayaktaOmuzY) > govde * 0.35;
    bilgi.textContent = egildi ? "EĞİLDİN" : "AYAKTA  (yeniden ölçmek için dokun)";
  }

  // Çizim
  ctx.strokeStyle = "#fff";
  ctx.fillStyle = "#fff";
  ctx.lineWidth = Math.max(omuzGenislik * 0.09, 4);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  const cizgi = (...p) => {
    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y);
    ctx.stroke();
  };

  cizgi(boyun, kalca);                       // gövde
  cizgi(boyun, solDirsek, solBilek);         // kollar
  cizgi(boyun, sagDirsek, sagBilek);
  cizgi(kalca, solDiz, solAyak);             // bacaklar
  cizgi(kalca, sagDiz, sagAyak);
  cizgi(boyun, { x: burun.x, y: burun.y + kafaYaricap }); // boyun

  ctx.beginPath();                           // kafa
  ctx.arc(burun.x, burun.y, kafaYaricap, 0, Math.PI * 2);
  ctx.stroke();
}
</script>
</body>
</html>
