<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kamera Koşusu</title>
<style>
  html, body { margin: 0; height: 100%; background: #9ee7ff; overflow: hidden;
    font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #oyun { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #video { position: fixed; right: 10px; bottom: 10px; width: 84px; border-radius: 10px;
    transform: scaleX(-1); opacity: .85; border: 2px solid #fff; display: none; }
  #ust { position: fixed; left: 0; right: 0; top: 0; padding: 12px 16px; display: flex;
    justify-content: space-between; color: #fff; font-weight: 800; font-size: 22px;
    text-shadow: 0 2px 0 rgba(0,0,0,.25); pointer-events: none; }
  #durum { position: fixed; left: 0; right: 0; top: 52px; text-align: center; color: #fff;
    font-weight: 700; font-size: 16px; text-shadow: 0 2px 0 rgba(0,0,0,.3); pointer-events: none; }
  #panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(84vw, 340px); padding: 22px; border-radius: 22px; text-align: center;
    background: rgba(255,255,255,.94); color: #4a2a6b; box-shadow: 0 10px 0 rgba(0,0,0,.12); }
  #panel h1 { margin: 0 0 8px; font-size: 26px; color: #ff4f9a; }
  #panel p { margin: 6px 0; font-size: 16px; line-height: 1.4; }
  #panel .buyuk { font-size: 34px; font-weight: 900; color: #ff8a00; }
  #panel button { margin-top: 12px; padding: 14px 34px; font-size: 20px; font-weight: 800;
    color: #fff; background: #ff4f9a; border: 0; border-radius: 14px; box-shadow: 0 5px 0 #c92f73; }
  #kilit { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
    background: rgba(74,42,107,.93); color: #fff; font-size: 22px; font-weight: 800; }
  #kilit .ikon { font-size: 64px; }
  #kilit button { padding: 14px 34px; font-size: 20px; font-weight: 800; color: #fff;
    background: #ff4f9a; border: 0; border-radius: 14px; box-shadow: 0 5px 0 #c92f73; }
  #tamEkran { position: fixed; left: 10px; bottom: 10px; z-index: 10; width: 46px; height: 46px;
    font-size: 24px; color: #fff; background: rgba(0,0,0,.35); border: 2px solid #fff;
    border-radius: 12px; display: none; }
</style>
</head>
<body>
<canvas id="oyun"></canvas>
<video id="video" playsinline muted></video>
<div id="ust"><span id="skor">0</span><span id="elmas">💎 0</span></div>
<div id="durum"></div>
<button id="tamEkran">⛶</button>
<div id="kilit"><div class="ikon" id="kilitIkon"></div><div id="kilitYazi"></div>
  <button id="kilitDugme">Tam ekran yap</button></div>
<div id="panel">
  <h1>Kamera Koşusu</h1>
  <p>Telefonu yan çevirip sabitle, 1,5-2 m geri çekil.</p>
  <p>Sağa / sola adım at, zıpla, eğil.<br>Elmasları topla, engellerden kaç.</p>
  <button id="basla">Başla</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { PoseLandmarker, FilesetResolver } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ---------------------------------------------------------------- Ayarlar
const SERIT_X = [-2, 0, 2];
const HIZ_BAS = 9, HIZ_MAX = 22;                      // birim/sn
const ZORLUK_SURE = 600;                              // sn: en zor hâle 10 dakikada ulaşır
const ARALIK_BAS = 3.2, ARALIK_SON = 1.7;             // engeller arası süre (sn)
const ZIPLA_HIZ = 12, YERCEKIMI = 26;                 // tepe ~2,8 birim
const ZIPLA_YARDIM_SN = 1.0;                          // zıplayınca bu kadar sn ilerideki alçak engel geçilmiş sayılır
const CARPMA_GECIKME_SN = 0.22;                       // alçak engelde çarpma bu kadar geç sayılır (geç zıplamayı kurtarır)
const DOGMA_Z = -95;
const ZIPLA_ESIK = 0.12;   // gövde boyunun bu kadarı yükselince zıplama sayılır (küçük zıplama yeter)
const EGIL_ESIK = 0.30;    // gövde boyunun bu kadarı alçalınca eğilme sayılır
const SERIT_ESIK = 0.45;   // omuz genişliğinin bu kadarı yana kayınca şerit değişir

// ---------------------------------------------------------------- Sesler
const SES_YOL = {
  elmas:  "assets/ses/elmaslar/elmas.mp3",
  zipla:  "assets/ses/popeye/sekme1.mp3",
  carp:   "assets/ses/popeye/bastonVur.mp3",
  vur:    "assets/ses/popeye/ayakVur.mp3",
  kaybet: "assets/ses/popeye/tamKaybet.mp3",
  adim1:  "assets/ses/popeye/adim1.mp3",
  adim2:  "assets/ses/popeye/adim2.mp3",
  adim3:  "assets/ses/popeye/adim3.mp3"
};
const sesler = {};
function sesleriYukle() {
  for (const ad in SES_YOL) {
    const adet = ad === "elmas" ? 4 : 1;
    sesler[ad] = { liste: [], sira: 0 };
    for (let i = 0; i < adet; i++) {
      const a = new Audio(SES_YOL[ad]);
      a.preload = "auto";
      sesler[ad].liste.push(a);
    }
  }
}
function cal(ad, siddet = 1) {
  const s = sesler[ad];
  if (!s) return;
  const a = s.liste[s.sira++ % s.liste.length];
  try { a.currentTime = 0; a.volume = siddet; a.play().catch(() => {}); } catch (e) {}
}

// ---------------------------------------------------------------- Sahne
const tuval = document.getElementById("oyun");
const cizer = new THREE.WebGLRenderer({ canvas: tuval, antialias: true });
cizer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
const sahne = new THREE.Scene();
sahne.background = new THREE.Color(0x9ee7ff);
sahne.fog = new THREE.Fog(0x9ee7ff, 45, 100);
const kamera = new THREE.PerspectiveCamera(62, 1, 0.1, 200);

function boyutla() {
  cizer.setSize(innerWidth, innerHeight, false);
  kamera.aspect = innerWidth / innerHeight;
  // Dar (dikey) ekranda üç şerit de görünsün diye kamerayı geri çek
  const dar = kamera.aspect < 1;
  kamera.position.set(0, dar ? 5.2 : 4.2, dar ? 9.5 : 7.5);
  kamera.lookAt(0, 1.2, -7);
  kamera.updateProjectionMatrix();
}
addEventListener("resize", boyutla);
boyutla();

sahne.add(new THREE.HemisphereLight(0xffffff, 0xffc4e6, 1.15));
const gunes = new THREE.DirectionalLight(0xffffff, 1.1);
gunes.position.set(4, 10, 6);
sahne.add(gunes);

const mat = renk => new THREE.MeshLambertMaterial({ color: renk });
const M = {
  cim: mat(0x9be37c), yol: mat(0xffd7ea), yol2: mat(0xffc2df), cizgi: mat(0xffffff),
  pembe: mat(0xff4f9a), sari: mat(0xffd23f), mor: mat(0x9b6bff), turkuaz: mat(0x35d6c6),
  turuncu: mat(0xff8a3c), beyaz: mat(0xffffff), kahve: mat(0xa9744f), ten: mat(0xffd2a8),
  lacivert: mat(0x3b4cc0), kirmizi: mat(0xff4d4d), siyah: mat(0x222233),
  elmas: new THREE.MeshPhongMaterial({ color: 0x4fd8ff, emissive: 0x1a7fb0, shininess: 120, flatShading: true }),
  golge: new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.22 })
};

// Zemin
const cim = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), M.cim);
cim.rotation.x = -Math.PI / 2; cim.position.set(0, -0.02, -60);
sahne.add(cim);
const yol = new THREE.Mesh(new THREE.PlaneGeometry(6.6, 240), M.yol);
yol.rotation.x = -Math.PI / 2; yol.position.z = -60;
sahne.add(yol);
for (const x of [-1, 1]) {            // şerit çizgileri
  const c = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 240), M.cizgi);
  c.rotation.x = -Math.PI / 2; c.position.set(x, 0.005, -60);
  sahne.add(c);
}
for (const x of [-3.45, 3.45]) {      // şeker kaldırım
  const k = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 240), M.beyaz);
  k.position.set(x, 0.15, -60);
  sahne.add(k);
}

// Kayan şeritler (hız hissi) ve kenar süsleri
const kayanlar = [];
const SERIT_ARALIK = 8, SERIT_ADET = 14;
for (let i = 0; i < SERIT_ADET; i++) {
  const s = new THREE.Mesh(new THREE.PlaneGeometry(6.6, 3.5), M.yol2);
  s.rotation.x = -Math.PI / 2;
  s.position.set(0, 0.003, 10 - i * SERIT_ARALIK);
  sahne.add(s);
  kayanlar.push({ ag: s, tur: SERIT_ADET * SERIT_ARALIK });
}
const gTop = new THREE.SphereGeometry(1, 14, 10);
const gSap = new THREE.CylinderGeometry(0.1, 0.1, 1, 8);
const gKoni = new THREE.ConeGeometry(1, 2, 10);
function lolipop(renk) {
  const g = new THREE.Group();
  const sap = new THREE.Mesh(gSap, M.beyaz); sap.scale.y = 2.6; sap.position.y = 1.3;
  const top = new THREE.Mesh(gTop, renk); top.scale.set(0.9, 0.9, 0.35); top.position.y = 3;
  g.add(sap, top); return g;
}
function agac(renk) {
  const g = new THREE.Group();
  const govde = new THREE.Mesh(gSap, M.kahve); govde.scale.set(3, 1.2, 3); govde.position.y = 0.6;
  const tac = new THREE.Mesh(gKoni, renk); tac.scale.set(1.2, 1.5, 1.2); tac.position.y = 2.6;
  g.add(govde, tac); return g;
}
const SUS_ADET = 22, SUS_ARALIK = 6;
const susRenk = [M.pembe, M.sari, M.mor, M.turkuaz, M.turuncu];
for (let i = 0; i < SUS_ADET; i++) {
  for (const yon of [-1, 1]) {
    const renk = susRenk[(i * 3 + (yon > 0 ? 1 : 0)) % susRenk.length];
    const s = (i + (yon > 0 ? 1 : 0)) % 2 ? lolipop(renk) : agac(renk);
    s.position.set(yon * (5 + Math.random() * 7), 0, 10 - i * SUS_ARALIK - Math.random() * 3);
    sahne.add(s);
    kayanlar.push({ ag: s, tur: SUS_ADET * SUS_ARALIK });
  }
}
// Bulutlar
for (let i = 0; i < 9; i++) {
  const b = new THREE.Group();
  for (let k = 0; k < 3; k++) {
    const p = new THREE.Mesh(gTop, new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false }));
    p.scale.set(2.2 - k * 0.4, 1.2, 1.4); p.position.set(k * 1.8 - 1.8, k % 2 * 0.5, 0);
    b.add(p);
  }
  b.position.set((Math.random() - 0.5) * 90, 14 + Math.random() * 10, -50 - Math.random() * 40);
  sahne.add(b);
}

// ---------------------------------------------------------------- Karakter
const oyuncu = new THREE.Group();
const beden = new THREE.Group();          // eğilince bu ezilir
oyuncu.add(beden);
const gKapsul = new THREE.CapsuleGeometry(0.5, 1, 6, 12);
function parca(malzeme, sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(gKapsul, malzeme);
  m.scale.set(sx, sy, sz); m.position.set(x, y, z); return m;
}
const govde = parca(M.pembe, 0.72, 0.38, 0.6, 0, 0.95, 0);
const kafa = new THREE.Mesh(gTop, M.ten); kafa.scale.setScalar(0.36); kafa.position.y = 1.58;
const sapka = new THREE.Mesh(gTop, M.sari); sapka.scale.set(0.38, 0.2, 0.38); sapka.position.y = 1.82;
const siper = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.3), M.sari); siper.position.set(0, 1.78, -0.36);
beden.add(govde, kafa, sapka, siper);
function uzuv(malzeme, x, y, boy) {
  const mil = new THREE.Group(); mil.position.set(x, y, 0);
  const m = new THREE.Mesh(gKapsul, malzeme);
  m.scale.set(0.2, boy / 2, 0.2); m.position.y = -boy / 2;
  mil.add(m); beden.add(mil); return mil;
}
const solKol = uzuv(M.ten, -0.5, 1.25, 0.6), sagKol = uzuv(M.ten, 0.5, 1.25, 0.6);
const solBacak = uzuv(M.lacivert, -0.2, 0.68, 0.68), sagBacak = uzuv(M.lacivert, 0.2, 0.68, 0.68);
sahne.add(oyuncu);
const golge = new THREE.Mesh(new THREE.CircleGeometry(0.55, 20), M.golge);
golge.rotation.x = -Math.PI / 2; golge.position.y = 0.01;
sahne.add(golge);

// ---------------------------------------------------------------- Engeller ve elmaslar
const gKutu = new THREE.BoxGeometry(1, 1, 1);
const gElmas = new THREE.OctahedronGeometry(0.38, 0);
let nesneler = [];   // { ag, tip, x, yari, z }

function nesneEkle(ag, tip, x, yari, z, ek = {}) {
  ag.position.x = x; ag.position.z = z;
  sahne.add(ag);
  nesneler.push({ ag, tip, x, yari, z, ...ek });
}
function alcakEngel(x, genislik, z) {       // üstünden zıplanır
  const g = new THREE.Group();
  const govde = new THREE.Mesh(gKutu, M.turuncu); govde.scale.set(genislik, 0.7, 0.5); govde.position.y = 0.35;
  const serit = new THREE.Mesh(gKutu, M.beyaz); serit.scale.set(genislik + 0.02, 0.18, 0.52); serit.position.y = 0.42;
  g.add(govde, serit);
  nesneEkle(g, "alcak", x, genislik / 2, z);
}
function yuksekEngel(x, genislik, z) {      // altından eğilerek geçilir
  const g = new THREE.Group();
  const kiris = new THREE.Mesh(gKutu, M.mor); kiris.scale.set(genislik, 0.9, 0.5); kiris.position.y = 1.85;
  const serit = new THREE.Mesh(gKutu, M.sari); serit.scale.set(genislik + 0.02, 0.2, 0.52); serit.position.y = 1.55;
  g.add(kiris, serit);
  for (const yon of [-1, 1]) {
    const d = new THREE.Mesh(gKutu, M.beyaz); d.scale.set(0.22, 2.3, 0.22);
    d.position.set(yon * (genislik / 2 + 0.11), 1.15, 0); g.add(d);
  }
  nesneEkle(g, "yuksek", x, genislik / 2, z);
}
function blokEngel(x, z) {                  // yanından geçilir
  const g = new THREE.Group();
  const renk = [M.kirmizi, M.turkuaz, M.pembe][Math.floor(Math.random() * 3)];
  const kutu = new THREE.Mesh(gKutu, renk); kutu.scale.set(1.7, 2.6, 1.2); kutu.position.y = 1.3;
  const kurdele = new THREE.Mesh(gKutu, M.beyaz); kurdele.scale.set(0.3, 2.62, 1.22); kurdele.position.y = 1.3;
  const kurdele2 = new THREE.Mesh(gKutu, M.beyaz); kurdele2.scale.set(1.72, 0.3, 1.22); kurdele2.position.y = 1.5;
  g.add(kutu, kurdele, kurdele2);
  nesneEkle(g, "blok", x, 0.85, z);
}
function elmasEkle(x, y, z) {
  const e = new THREE.Mesh(gElmas, M.elmas);
  e.scale.y = 1.35; e.position.y = y;
  nesneEkle(e, "elmas", x, 0.4, z, { y });
}
const rast = n => Math.floor(Math.random() * n);

function satirUret(z) {
  const tur = Math.random();
  // Her satırdan önce, oyuncuya doğru uzanan elmas dizisi (güvenli şeritte)
  const dizi = (x, y, adet) => { for (let k = 1; k <= adet; k++) elmasEkle(x, y, z + 3 + k * 2.4); };
  if (tur < 0.34) {                                   // iki şerit kapalı
    const bos = rast(3);
    for (let s = 0; s < 3; s++) if (s !== bos) blokEngel(SERIT_X[s], z);
    dizi(SERIT_X[bos], 1.0, 7);
    elmasEkle(SERIT_X[bos], 1.0, z); elmasEkle(SERIT_X[bos], 1.0, z - 2.4);
  } else if (tur < 0.52) {                            // tek şerit kapalı
    const dolu = rast(3);
    blokEngel(SERIT_X[dolu], z);
    const bos = (dolu + 1 + rast(2)) % 3;
    dizi(SERIT_X[bos], 1.0, 7);
    elmasEkle(SERIT_X[bos], 1.0, z); elmasEkle(SERIT_X[bos], 1.0, z - 2.4);
  } else if (tur < 0.76) {                            // boydan boya alçak: zıpla
    alcakEngel(0, 6.4, z);
    const s = rast(3);
    dizi(SERIT_X[s], 1.0, 5);
    elmasEkle(SERIT_X[s], 1.5, z + 2.2);
    elmasEkle(SERIT_X[s], 2.0, z + 0.8);
    elmasEkle(SERIT_X[s], 2.0, z - 0.8);
    elmasEkle(SERIT_X[s], 1.5, z - 2.2);
  } else {                                            // boydan boya yüksek: eğil
    yuksekEngel(0, 6.4, z);
    const s = rast(3);
    dizi(SERIT_X[s], 0.9, 5);
    for (let k = -1; k <= 1; k++) elmasEkle(SERIT_X[s], 0.55, z + k * 2);
  }
}

// ---------------------------------------------------------------- Oyun durumu
const elSkor = document.getElementById("skor"), elElmas = document.getElementById("elmas");
const elDurum = document.getElementById("durum"), panel = document.getElementById("panel");
let durum = "menu";         // menu | olcum | oyun | bitti
let hiz, mesafe, sonrakiSatir, elmasSayi, sure, bittiSure;
let serit = 1, py = 0, vy = 0, havada = false, egik = false, kosuFaz = 0;
let enYuksek = 0;
try { enYuksek = parseInt(localStorage.getItem("kamKosuMax")) || 0; } catch (e) {}

// Kontrol girdisi (kamera, klavye ve kaydırma aynı yere yazar)
const girdi = { serit: 1, egil: false, zipla: false, elHavada: false };

function sifirla() {
  for (const n of nesneler) sahne.remove(n.ag);
  nesneler = [];
  hiz = HIZ_BAS; mesafe = 0; sonrakiSatir = 30; elmasSayi = 0; sure = 0;
  serit = 1; girdi.serit = 1; girdi.zipla = false;
  py = 0; vy = 0; havada = false; egik = false;
  oyuncu.position.set(0, 0, 0); oyuncu.rotation.set(0, 0, 0);
  beden.scale.set(1, 1, 1);
  elSkor.textContent = "0"; elElmas.textContent = "💎 0";
}
function oyunuBaslat(devam) {
  if (!devam) sifirla();
  panel.style.display = "none";
  elDurum.textContent = "";
  durum = "oyun";
}
let olcumDevam = false;     // true: ölçüm bitince oyun kaldığı yerden sürer
function olcumeGec(devam) {
  olcumDevam = devam === true;
  if (!olcumDevam) sifirla();
  panel.style.display = "none";
  if (!kameraVar) { oyunuBaslat(olcumDevam); return; }
  olcum.sayac = 0; olcum.x = 0; olcum.y = 0; olcum.gen = 0; olcum.govde = 0;
  durum = "olcum";
  elDurum.textContent = "Ortada dik dur, ölçüyorum...";
}
function oyunBitti() {
  durum = "bitti"; bittiSure = 0;
  cal("carp"); cal("vur", 0.8);
  setTimeout(() => cal("kaybet"), 250);
  const skor = Math.floor(mesafe) + elmasSayi * 10;
  const rekor = skor > enYuksek;
  if (rekor) { enYuksek = skor; try { localStorage.setItem("kamKosuMax", String(skor)); } catch (e) {} }
  panel.innerHTML =
    "<h1>" + (rekor ? "Yeni rekor!" : "Çarptın!") + "</h1>" +
    "<p>Skor</p><p class='buyuk'>" + skor + "</p>" +
    "<p>💎 " + elmasSayi + " &nbsp;•&nbsp; En yüksek: <b>" + enYuksek + "</b></p>" +
    "<p>" + (kameraVar ? "🙌 Ellerini havaya kaldır, yeniden başlasın" : "") + "</p>" +
    "<button id='tekrar'>Tekrar</button>";
  panel.style.display = "block";
  document.getElementById("tekrar").addEventListener("click", () => olcumeGec());
  elDurum.textContent = "";
}

// ---------------------------------------------------------------- Kamera ile hareket algılama
const video = document.getElementById("video");
let algilayici = null, kameraVar = false, sonVideoZaman = -1;
const olcum = { sayac: 0, x: 0, y: 0, gen: 0, govde: 0 };
const temel = { x: 0.5, y: 0.4, gen: 0.2, govde: 0.25 };
let yumY = null, yumX = null;
let ziplaHazir = true, ziplaBekle = 0, oncekiFark = 0, kolHazir = true;

async function kamerayiAc() {
  const akis = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
  });
  video.srcObject = akis;
  await video.play();
  video.style.display = "block";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  algilayici = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO", numPoses: 1
  });
  kameraVar = true;
}

function pozOku() {
  if (!kameraVar || video.readyState < 2 || video.currentTime === sonVideoZaman) return;
  sonVideoZaman = video.currentTime;
  const sonuc = algilayici.detectForVideo(video, performance.now());
  const n = sonuc.landmarks && sonuc.landmarks[0];
  if (!n) { girdi.elHavada = false; return; }

  const omuzX = (n[11].x + n[12].x) / 2, omuzY = (n[11].y + n[12].y) / 2;
  const kalcaY = (n[23].y + n[24].y) / 2;
  const gen = Math.abs(n[11].x - n[12].x);
  if (yumY === null) { yumY = omuzY; yumX = omuzX; }
  yumY += (omuzY - yumY) * 0.65;
  yumX += (omuzX - yumX) * 0.5;

  // Eller havada: iki bilek de burnun üstünde
  girdi.elHavada = n[15].y < n[0].y - 0.02 && n[16].y < n[0].y - 0.02;

  if (durum === "olcum") {
    if (girdi.elHavada) { olcum.sayac = 0; olcum.x = olcum.y = olcum.gen = olcum.govde = 0;
      elDurum.textContent = "Ellerini indir, ortada dik dur..."; return; }
    elDurum.textContent = "Ortada dik dur, ölçüyorum...";
    olcum.sayac++; olcum.x += omuzX; olcum.y += omuzY; olcum.gen += gen; olcum.govde += Math.abs(kalcaY - omuzY);
    if (olcum.sayac >= 20) {
      temel.x = olcum.x / 20; temel.y = olcum.y / 20;
      temel.gen = Math.max(olcum.gen / 20, 0.05); temel.govde = Math.max(olcum.govde / 20, 0.08);
      yumY = temel.y; yumX = temel.x;
      ziplaHazir = true; kolHazir = true; ziplaBekle = 0; oncekiFark = 0;
      girdi.serit = serit; girdi.zipla = false; girdi.egil = false;
      oyunuBaslat(olcumDevam);
    }
    return;
  }
  if (durum !== "oyun") return;

  // Şerit: ön kamera aynalı olduğu için yön ters çevrilir
  const kayma = -(yumX - temel.x) / temel.gen;
  const es = SERIT_ESIK, donus = SERIT_ESIK * 0.55;
  if (kayma > es) girdi.serit = 2;
  else if (kayma < -es) girdi.serit = 0;
  else if (Math.abs(kayma) < donus) girdi.serit = 1;

  // Zıplama / eğilme: omuz yüksekliğinin ölçülen hâle göre değişimi
  const fark = (temel.y - yumY) / temel.govde;      // + yukarı, - aşağı
  const simdi = performance.now();
  // Tek zıplama = tek tetikleme: omuzlar normale dönene ve kısa bir süre geçene kadar yenisi sayılmaz
  if (ziplaHazir && fark > ZIPLA_ESIK && simdi > ziplaBekle) {
    girdi.zipla = true; ziplaHazir = false; ziplaBekle = simdi + 900;
  } else if (!ziplaHazir && fark < ZIPLA_ESIK * 0.4) {
    ziplaHazir = true;
  }
  // Kolları iki yana açmak da zıplama sayılır
  const solAcik = Math.abs(n[15].x - n[11].x) > temel.gen * 0.85 && Math.abs(n[15].y - n[11].y) < temel.govde * 0.6;
  const sagAcik = Math.abs(n[16].x - n[12].x) > temel.gen * 0.85 && Math.abs(n[16].y - n[12].y) < temel.govde * 0.6;
  if (solAcik && sagAcik) {
    if (kolHazir && simdi > ziplaBekle) { girdi.zipla = true; kolHazir = false; ziplaBekle = simdi + 900; }
  } else if (!solAcik && !sagAcik) kolHazir = true;
  girdi.egil = fark < -EGIL_ESIK && simdi > ziplaBekle - 400;   // iniş esnemesi eğilme sayılmasın
  // Duruş yavaşça kaydıysa (biraz öne/arkaya geçtiysen) ölçümü sessizce güncelle
  if (Math.abs(fark - oncekiFark) < 0.015 && fark > -0.2 && fark < 0.3)
    temel.y += (yumY - temel.y) * 0.06;
  oncekiFark = fark;
}

// ---------------------------------------------------------------- Klavye ve kaydırma (yedek kontrol)
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") girdi.serit = Math.max(0, girdi.serit - 1);
  else if (e.key === "ArrowRight") girdi.serit = Math.min(2, girdi.serit + 1);
  else if (e.key === "ArrowUp" || e.key === " ") girdi.zipla = true;
  else if (e.key === "ArrowDown") girdi.egil = true;
  else if (e.key === "Enter" && durum === "bitti") olcumeGec();
});
addEventListener("keyup", e => { if (e.key === "ArrowDown") girdi.egil = false; });
let dokunma = null;
tuval.addEventListener("pointerdown", e => { dokunma = { x: e.clientX, y: e.clientY }; });
tuval.addEventListener("pointerup", e => {
  if (!dokunma) return;
  const dx = e.clientX - dokunma.x, dy = e.clientY - dokunma.y; dokunma = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  if (Math.abs(dx) > Math.abs(dy)) girdi.serit = Math.max(0, Math.min(2, girdi.serit + (dx > 0 ? 1 : -1)));
  else if (dy < 0) girdi.zipla = true;
  else { girdi.egil = true; setTimeout(() => { girdi.egil = false; }, 700); }
});

// ---------------------------------------------------------------- Tam ekran + yatay zorunluluğu
const kok = document.documentElement;
const tamEkranDestek = !!(kok.requestFullscreen || kok.webkitRequestFullscreen);
const tamEkranMi = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const elKilit = document.getElementById("kilit"), elKilitYazi = document.getElementById("kilitYazi");
const elKilitIkon = document.getElementById("kilitIkon"), elKilitDugme = document.getElementById("kilitDugme");
const elTamEkran = document.getElementById("tamEkran");
let basladi = false, engel = false;

async function tamEkranAc() {
  try {
    if (kok.requestFullscreen) await kok.requestFullscreen({ navigationUI: "hide" });
    else if (kok.webkitRequestFullscreen) kok.webkitRequestFullscreen();
  } catch (e) {}
  try { await screen.orientation.lock("landscape"); } catch (e) {}   // destekleyen telefonda yatay kilitler
  engelKontrol();
}
function tamEkranKapat() {
  try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {}
}
function engelKontrol() {
  if (!basladi) return;
  const tamYok = tamEkranDestek && !tamEkranMi();
  const dikey = innerWidth < innerHeight;
  const yeni = tamYok || dikey;
  if (tamYok) {
    elKilitIkon.textContent = "⛶"; elKilitYazi.textContent = "Oyun tam ekranda oynanır";
    elKilitDugme.style.display = "";
  } else if (dikey) {
    elKilitIkon.textContent = "📱↻"; elKilitYazi.textContent = "Telefonu yan çevir";
    elKilitDugme.style.display = "none";
  }
  elKilit.style.display = yeni ? "flex" : "none";
  // Engel kalktı: kamera açısı değiştiği için yeniden ölç, oyun kaldığı yerden sürsün
  if (engel && !yeni && (durum === "oyun" || durum === "olcum")) olcumeGec(durum === "oyun" || olcumDevam);
  engel = yeni;
}
elKilitDugme.addEventListener("click", tamEkranAc);
elTamEkran.addEventListener("click", () => { tamEkranMi() ? tamEkranKapat() : tamEkranAc(); });
for (const olay of ["resize", "orientationchange", "fullscreenchange", "webkitfullscreenchange"])
  addEventListener(olay, () => setTimeout(engelKontrol, 150));
document.addEventListener("fullscreenchange", () => setTimeout(engelKontrol, 150));
document.addEventListener("webkitfullscreenchange", () => setTimeout(engelKontrol, 150));

// ---------------------------------------------------------------- Başlat düğmesi
document.getElementById("basla").addEventListener("click", async () => {
  tamEkranAc();                       // dokunma anında çağrılmalı
  basladi = true; engel = true;       // yatay + tam ekran olana kadar ölçüm başlamaz
  if (tamEkranDestek) elTamEkran.style.display = "block";
  sesleriYukle();
  panel.innerHTML = "<h1>Hazırlanıyor</h1><p>Kamera ve model yükleniyor...</p>";
  try { await kamerayiAc(); }
  catch (hata) {
    engelKontrol();
    panel.innerHTML = "<h1>Kamera açılamadı</h1><p>" + hata.message +
      "</p><p>Kaydırarak / ok tuşlarıyla oynayabilirsin.</p><button id='devam'>Devam</button>";
    document.getElementById("devam").addEventListener("click", () => olcumeGec());
    return;
  }
  durum = "olcum"; olcumDevam = false;
  panel.style.display = "none";
  engel = true; engelKontrol();       // yataysa ölçüm hemen başlar, değilse yan çevrilince
  if (!engel) olcumeGec();
});

// ---------------------------------------------------------------- Ana döngü
const saat = new THREE.Clock();
function guncelle(dt) {
  if (durum === "oyun") {
    sure += dt;
    const zorluk = Math.min(1, sure / ZORLUK_SURE);      // 0 → 1, 10 dakikada
    hiz = HIZ_BAS + (HIZ_MAX - HIZ_BAS) * zorluk;
    const yol = hiz * dt;
    mesafe += yol;

    // Yeni satır
    if (mesafe >= sonrakiSatir) {
      satirUret(DOGMA_Z);
      const aralikSn = ARALIK_BAS + (ARALIK_SON - ARALIK_BAS) * zorluk;
      sonrakiSatir = mesafe + hiz * aralikSn;
    }

    // Oyuncu hareketi
    serit = girdi.serit;
    oyuncu.position.x += (SERIT_X[serit] - oyuncu.position.x) * Math.min(1, dt * 14);
    if (girdi.zipla) {
      // Zıplama yardımı: yakındaki (ve tam çarpma anındaki) alçak engel geçilmiş sayılır
      for (const n of nesneler)
        if (n.tip === "alcak" && n.z > -hiz * ZIPLA_YARDIM_SN && n.z < 0.6 + hiz * CARPMA_GECIKME_SN) n.gecildi = true;
      if (!havada) { vy = ZIPLA_HIZ; havada = true; cal("zipla"); }
    }
    girdi.zipla = false;
    if (havada) {
      vy -= YERCEKIMI * dt; py += vy * dt;
      if (py <= 0) { py = 0; vy = 0; havada = false; }
    }
    egik = girdi.egil && !havada;
    const hedefOlcek = egik ? 0.5 : 1;
    beden.scale.y += (hedefOlcek - beden.scale.y) * Math.min(1, dt * 18);
    oyuncu.position.y = py;
    const boy = 1.9 * beden.scale.y;

    // Koşu animasyonu
    const oncekiAdim = Math.floor(kosuFaz / Math.PI);
    kosuFaz += dt * (6 + hiz * 0.5);
    if (!havada && Math.floor(kosuFaz / Math.PI) !== oncekiAdim) cal("adim" + (1 + rast(3)), 0.18);
    const sal = havada ? 0.9 : Math.sin(kosuFaz) * 0.9;
    solBacak.rotation.x = sal; sagBacak.rotation.x = havada ? -0.5 : -sal;
    solKol.rotation.x = -sal; sagKol.rotation.x = havada ? -2.4 : sal;
    solKol.rotation.z = havada ? -0.3 : 0;
    beden.position.y = havada ? 0 : Math.abs(Math.sin(kosuFaz)) * 0.07;

    // Nesneler
    const ox = oyuncu.position.x;
    for (let i = nesneler.length - 1; i >= 0; i--) {
      const n = nesneler[i];
      n.z += yol; n.ag.position.z = n.z;
      if (n.tip === "elmas") {
        n.ag.rotation.y += dt * 4;
        if (Math.abs(n.z) < 0.9 && Math.abs(n.x - ox) < 0.95 && n.y > py - 0.35 && n.y < py + boy + 0.35) {
          sahne.remove(n.ag); nesneler.splice(i, 1);
          elmasSayi++; cal("elmas", 0.7);
          continue;
        }
      } else if (n.tip === "alcak") {
        // Üstündeyken havadaysa geçildi; değilse çarpma biraz geç sayılır ki geç zıplama kurtarsın
        if (Math.abs(n.z) < 0.6 && py >= 0.6) n.gecildi = true;
        if (!n.gecildi && n.z >= 0.6 + hiz * CARPMA_GECIKME_SN && n.z < 0.6 + hiz * CARPMA_GECIKME_SN + yol + 0.01) { oyunBitti(); return; }
      } else if (Math.abs(n.z) < 0.6 && Math.abs(n.x - ox) < n.yari + 0.3) {
        const carpti = n.tip === "blok" || (n.tip === "yuksek" && py + boy > 1.4);
        if (carpti) { oyunBitti(); return; }
      }
      if (n.z > 12) { sahne.remove(n.ag); nesneler.splice(i, 1); }
    }

    // Kayan zemin şeritleri ve süsler
    for (const k of kayanlar) {
      k.ag.position.z += yol;
      if (k.ag.position.z > 14) k.ag.position.z -= k.tur;
    }

    elSkor.textContent = Math.floor(mesafe) + elmasSayi * 10;
    elElmas.textContent = "💎 " + elmasSayi;
  } else if (durum === "bitti") {
    bittiSure += dt;
    oyuncu.rotation.x += (-1.45 - oyuncu.rotation.x) * Math.min(1, dt * 8);   // sırt üstü düş
    oyuncu.position.y += (0.3 - oyuncu.position.y) * Math.min(1, dt * 8);
    if (bittiSure > 1 && girdi.elHavada) olcumeGec();
  } else {
    // Menü / ölçüm: yerinde hafif sallan
    kosuFaz += dt * 3;
    beden.position.y = Math.sin(kosuFaz) * 0.04;
    solKol.rotation.x = sagKol.rotation.x = solBacak.rotation.x = sagBacak.rotation.x = 0;
  }
  golge.position.x = oyuncu.position.x;
  const gs = Math.max(0.45, 1 - py * 0.3);
  golge.scale.set(gs, gs, gs);
}

function dongu() {
  requestAnimationFrame(dongu);
  const dt = Math.min(saat.getDelta(), 0.05);
  if (!engel) { pozOku(); guncelle(dt); }
  cizer.render(sahne, kamera);
}
sifirla();
dongu();
</script>
